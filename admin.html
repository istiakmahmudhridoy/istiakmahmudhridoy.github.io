<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Upload photo</title>
<style>
:root{--bg:#f8f6f2;--card:#fff;--ink:#0f172a;--soft:#5b6472;--line:#d5dbe6;--chip:#eef2f8;--amber:#f59e0b;--amberink:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1e27;--ink:#f1f5f9;--soft:#a3acba;--line:#2e3340;--chip:#242835;--amberink:#fbbf24}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1e27;--ink:#f1f5f9;--soft:#a3acba;--line:#2e3340;--chip:#242835;--amberink:#fbbf24}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,sans-serif;line-height:1.6;padding:16px}
.card{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{color:var(--soft);font-size:13.5px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--soft);margin:14px 0 6px}
input,select,textarea,button{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical}
#prev{width:100%;max-height:260px;object-fit:contain;border-radius:14px;margin-top:12px;background:var(--chip)}
#go{margin-top:18px;background:linear-gradient(90deg,#fcd34d,var(--amber));color:#2b1b00;font-weight:600;border:0;cursor:pointer}
#go:disabled{opacity:.6}
#msg{margin-top:14px;font-size:14px;color:var(--soft);white-space:pre-wrap}
#msg.ok{color:#15803d}#msg.err{color:#b91c1c}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <h1>Upload a photo</h1>
  <div class="sub">Adds a photo to your portfolio. It goes live in 1–2 minutes.</div>

  <label for="tok">GitHub token (saved on this phone only)</label>
  <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">

  <label for="file">Photo</label>
  <input id="file" type="file" accept="image/*">
  <img id="prev" alt="" hidden>

  <label for="cat">Category</label>
  <select id="cat">
    <option value="rivers">Rivers &amp; Dusk</option>
    <option value="fields">Fields &amp; Roads</option>
    <option value="rain">Rain, Storm &amp; Silence</option>
    <option value="__new">+ New category…</option>
  </select>
  <input id="newcat" placeholder="New category name, e.g. Portraits" style="margin-top:8px" hidden>

  <label for="cap">Caption</label>
  <textarea id="cap" rows="2" placeholder="A line about this photo"></textarea>

  <button id="go">Upload</button>
  <div id="msg" role="status"></div>
</div>

<script>
var OWNER='istiakmahmudhridoy',REPO='istiakmahmudhridoy.github.io',BR='main';
var $=function(i){return document.getElementById(i)};
try{$('tok').value=localStorage.getItem('ptok')||''}catch(e){}

$('file').onchange=function(){var f=this.files[0];if(!f){$('prev').hidden=true;return}$('prev').src=URL.createObjectURL(f);$('prev').hidden=false};
$('cat').onchange=function(){$('newcat').hidden=this.value!=='__new'};

function say(t,c){$('msg').textContent=t;$('msg').className=c||''}
function api(path,opt){
  opt=opt||{};
  var put=opt.method==='PUT';
  opt.headers={Authorization:'Bearer '+$('tok').value.trim(),Accept:'application/vnd.github+json'};
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path+(put?'':'?ref='+BR+'&t='+Date.now()),opt);
}
function shrink(f){
  return new Promise(function(ok,no){
    var u=URL.createObjectURL(f),i=new Image();
    i.onload=function(){
      var s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');
      c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg',.82).split(',')[1]);
    };
    i.onerror=function(){no(new Error('Could not read this image'))};
    i.src=u;
  });
}
function enc(t){return btoa(unescape(encodeURIComponent(t)))}
function dec(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,''))))}
async function fail(r,what){
  var m=''; try{m=(await r.json()).message}catch(e){}
  throw new Error(what+' failed ('+r.status+'). '+(r.status===401||r.status===403?'Check your token and its permission (Contents: Read and write). ':'')+(m||''));
}

$('go').onclick=async function(){
  var f=$('file').files[0],tok=$('tok').value.trim();
  var cat=$('cat').value==='__new'?$('newcat').value.trim():$('cat').value;
  var cap=$('cap').value.trim();
  if(!tok)return say('Paste your GitHub token first.','err');
  if(!f)return say('Choose a photo first.','err');
  if(!cat)return say('Choose or type a category.','err');
  if(!cap)return say('Write a short caption.','err');
  try{localStorage.setItem('ptok',tok)}catch(e){}
  $('go').disabled=true;
  try{
    say('Preparing photo…');
    var b64=await shrink(f),path='photos/'+Date.now()+'.jpg';
    say('Uploading photo…');
    var r=await api(path,{method:'PUT',body:JSON.stringify({message:'Add photo',content:b64,branch:BR})});
    if(!r.ok)await fail(r,'Photo upload');
    say('Adding caption…');
    var g=await api('photos.js');
    if(!g.ok)await fail(g,'Reading photos.js');
    var j=await g.json(),txt=dec(j.content),k=txt.lastIndexOf('];');
    if(k<0)throw new Error('photos.js looks different than expected.');
    txt=txt.slice(0,k)+'  '+JSON.stringify([cat,path,cap])+',\n'+txt.slice(k);
    var r2=await api('photos.js',{method:'PUT',body:JSON.stringify({message:'Add caption',content:enc(txt),sha:j.sha,branch:BR})});
    if(!r2.ok)await fail(r2,'Saving caption');
    say('Done! It will show on your site in 1–2 minutes.','ok');
    $('file').value='';$('cap').value='';$('prev').hidden=true;
  }catch(e){say(e.message||String(e),'err')}
  $('go').disabled=false;
};
</script>
</body>
</html>
